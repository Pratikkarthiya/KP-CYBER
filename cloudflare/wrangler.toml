name = "kp-cyber-portal"
main = "server.js"
compatibility_date = "2026-11-16"
compatibility_flags = ["nodejs_compat"]

[site]
bucket = "./public"

[[d1_databases]]
binding = "DB"
database_name = "kp-cyber-db"
database_id = "your-cloudflare-d1-database-uuid"

[vars]
NODE_ENV = "production"
JWT_SECRET = "your-custom-production-jwt-secret-key"
